<title>ダイエット記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root { --pink:#E8578F; --pink-dark:#C9366F; --pink-light:#FDEEF4; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
-webkit-tap-highlight-color: transparent;
overscroll-behavior-y: contain;
background: var(--pink-light);
color: #4A2C3A;
font-family: 'Noto Sans JP', sans-serif;
}
#app { min-height: 100vh; display: flex; flex-direction: column; position:
relative; }
.header { padding: 22px 18px 0; background: #fff; border-bottom: 1px solid #F6D9E6; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--pink); display: flex; align-items: center; justify-content: center; flex-shrink:
0; font-size: 16px; }
.brand-text { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; color: var(--pink-dark); }
.view-switch { display: flex; flex-wrap: nowrap; background: var(--pink-light);
border-radius: 20px; padding: 3px; gap: 1px; overflow-x: auto; }
.view-btn { display: flex; align-items: center; gap: 3px; border: none;
background: transparent; color: #C98AA8; font-size: 10.5px; font-weight: 700;
padding: 6px 7px; border-radius: 16px; cursor: pointer; font-family: inherit;
white-space: nowrap; }
.view-btn.active { background: var(--pink); color: #fff; }
.stats-row { display: flex; padding-bottom: 16px; }
.backup-row { display: flex; gap: 8px; padding: 0 18px 16px; }
.backup-btn { flex: 1; text-align: center; padding: 8px 4px; border-radius:
8px; border: 1px solid #F0C4D8; background: #FFF7FA; color: #C9366F; font-size:
11.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
.stat-card { flex: 1; text-align: center; padding: 0 6px; }
.stat-card + .stat-card { border-left: 1px solid #F6D9E6; }
.stat-num { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; color: var(--pink); line-height: 1; }
.stat-label { font-size: 11px; color: #B0708C; margin-top: 6px; }
.error-banner { margin: 10px 18px 0; padding: 8px 12px; background: #FBE4EC;
border: 1px solid #F0A8C4; color: #B0356A; font-size: 12px; border-radius: 8px; }
.saved-banner { margin: 10px 18px 0; padding: 8px 12px; background: #E9F7EE;
border: 1px solid #B6E3C5; color: #2E7D4F; font-size: 12px; border-radius: 8px;
font-weight: 700; }
.list { flex: 1; overflow-y: auto; padding: 18px 16px 100px; }
.empty-state { text-align: center; color: #4A2C3A; padding: 60px 20px; display:
flex; flex-direction: column; align-items: center; }
.loading-state { text-align: center; color: #B0708C; padding: 80px 20px; font-size: 13px; }
.date-header { display: flex; align-items: baseline; gap: 8px; margin-bottom:
10px; padding: 0 2px; }
.date-header-text { font-weight: 700; font-size: 14px; color: #4A2C3A; }
.date-header-sub { font-size: 11px; color: #C98AA8; font-family: 'JetBrains Mono', monospace; }
.card { display: flex; background: #fff; border: 1px solid #F6D9E6; border-radius: 12px; margin-bottom: 10px; overflow: hidden; animation: wl-in 0.2s ease;
cursor: pointer; }
@keyframes wl-in { from { opacity: 0; transform: translateY(6px); } to {
opacity: 1; transform: translateY(0); } }
.card-stripe { width: 4px; background: var(--pink); }
.card-body { flex: 1; padding: 12px 14px; }
.card-top-row { display: flex; justify-content: space-between; align-items:

<body>
<div id="app"></div>
<script>
"use strict";
// ---------- storage helpers (persistent, per-user) ----------
async function loadJSON(key, fallback) {
try {
var raw = localStorage.getItem(key);
return raw ? JSON.parse(raw) : fallback;
} catch (e) {
return fallback;
}
}
async function saveJSON(key, value) {
try {
localStorage.setItem(key, JSON.stringify(value));
return { ok: true };
} catch (e) {
return { ok: false, error: (e && (e.message || e.toString())) || "unknown-error" };
}
}
// ---------- date helpers ----------
function uid() {
return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function todayStr() {
var d = new Date();
return ymd(d.getFullYear(), d.getMonth(), d.getDate());
}
function ymd(y, m, d) {
return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2,
"0");
}
function formatDateLabel(dateStr) {
var d = new Date(dateStr + "T00:00:00");
var todayS = todayStr();
var yest = new Date();
yest.setDate(yest.getDate() - 1);
var yestS = yest.toISOString().slice(0, 10);
if (dateStr === todayS) return "今日";
if (dateStr === yestS) return "昨日";
return d.toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday:
"short" });
}
function escapeHtml(str) {
return String(str == null ? "" : str)
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#39;");
}
var WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
// ---------- state ----------
var state = {
entries: [],
meals: [],
motivations: [],
monthGoals: {},
loaded: false,
view: "calendar",
cursorMonth: (function () {
var d = new Date();
return { y: d.getFullYear(), m: d.getMonth() };
})(),
selectedDate: todayStr(),
showForm: false,
formTab: "workout",
formDate: todayStr(),
formMealType: "朝",
error: null,
saving: false,
savedFlash: false,
viewingPhoto: null
};
var pendingPhotoDataUrl = null;
var MEAL_TYPES = ["朝", "昼", "夜", "アルコール"];
var MEAL_MARK = { "朝": "朝", "昼": "昼", "夜": "夜", "アルコール": "🍺" };
var MEAL_BTN_LABEL = { "朝": "朝", "昼": "昼", "夜": "夜", "アルコール": "🍺" };
function mealLabel(type) {
return type === "アルコール" ? " アルコール" : type + "ごはん";
}
var goalSaveTimer = null;
function persistEntries() {
return saveJSON("workout-entries", state.entries).then(function (res) {
if (!res.ok) showError(res.error);
return res.ok;
});
}
function showError(detail) {
state.error = "保存に失敗しました" + (detail ? "（" + detail + "）" : "") + "。もう一度お試しください。";
render();
setTimeout(function () {
state.error = null;
render();
}, 6000);
}
function flashSaved() {
state.savedFlash = true;
render();
setTimeout(function () {
state.savedFlash = false;
render();
}, 1400);
}
async function addEntry(name, date, weight, note) {
var existing = state.entries.find(function (en) { return en.date === date; });
if (existing) {
existing.name = name;
existing.weight = weight;
existing.note = note;
existing.createdAt = Date.now();
} else {
state.entries.unshift({ id: uid(), createdAt: Date.now(), name: name, date:
date, weight: weight, note: note });
}
state.saving = true;
render();
var ok = await persistEntries();
state.saving = false;
state.showForm = false;
render();
if (ok) flashSaved();
}
async function deleteEntry(id) {
state.entries = state.entries.filter(function (en) { return en.id !== id; });
render();
await persistEntries();
}
function persistMeals() {
return saveJSON("meal-entries", state.meals).then(function (res) {
if (!res.ok) showError(res.error);
return res.ok;
});
}
function persistMotivations() {
return saveJSON("motivation-entries", state.motivations).then(function (res) {
if (!res.ok) showError(res.error);
return res.ok;
});
}
async function addMotivation(date, photo, note) {
if (!photo) return;
state.motivations.unshift({ id: uid(), createdAt: Date.now(), date: date, photo: photo, note: note || "" });
state.saving = true;
render();
var ok = await persistMotivations();
pendingPhotoDataUrl = null;
state.saving = false;
state.showForm = false;
render();
if (ok) flashSaved();
}
async function deleteMotivation(id) {
state.motivations = state.motivations.filter(function (m) { return m.id !== id; });
render();
await persistMotivations();
}
async function addMeal(date, mealType, photo, note) {
var existing = state.meals.find(function (m) { return m.date === date &&
m.mealType === mealType; });
if (existing) {
existing.photo = photo || null;
existing.note = note || "";
existing.createdAt = Date.now();
} else {
state.meals.unshift({ id: uid(), createdAt: Date.now(), date: date, mealType:
mealType, photo: photo || null, note: note || "" });
}
state.saving = true;
render();
var ok = await persistMeals();
pendingPhotoDataUrl = null;
state.saving = false;
state.showForm = false;
render();
if (ok) flashSaved();
}
async function deleteMeal(id) {
state.meals = state.meals.filter(function (m) { return m.id !== id; });
render();
await persistMeals();
}
function mealsByDate(dateStr) {
return state.meals.filter(function (m) { return m.date === dateStr; })
.sort(function (a, b) { return MEAL_TYPES.indexOf(a.mealType) -
MEAL_TYPES.indexOf(b.mealType); });
}
function mealTypesByDate() {
var map = {};
state.meals.forEach(function (m) {
if (!map[m.date]) map[m.date] = [];
if (map[m.date].indexOf(m.mealType) === -1) map[m.date].push(m.mealType);
});
Object.keys(map).forEach(function (date) {
map[date].sort(function (a, b) { return MEAL_TYPES.indexOf(a) -
MEAL_TYPES.indexOf(b); });
});
return map;
}
function resizeImageFile(file, callback) {
var reader = new FileReader();
reader.onload = function (e) {
var img = new Image();
img.onload = function () {
var maxW = 480;
var scale = Math.min(1, maxW / img.width);
var canvas = document.createElement("canvas");
canvas.width = Math.round(img.width * scale);
canvas.height = Math.round(img.height * scale);
var ctx = canvas.getContext("2d");
ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
callback(canvas.toDataURL("image/jpeg", 0.6));
};
img.src = e.target.result;
};
reader.readAsDataURL(file);
}
function exportData() {
var payload = {
exportedAt: new Date().toISOString(),
entries: state.entries,
meals: state.meals,
monthGoals: state.monthGoals
};
var blob = new Blob([JSON.stringify(payload, null, 2)], { type:
"application/json" });
var url = URL.createObjectURL(blob);
var a = document.createElement("a");
var stamp = todayStr();
a.href = url;
a.download = "training-log-backup-" + stamp + ".json";
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}
async function importDataFromFile(file) {
try {
var text = await file.text();
var data = JSON.parse(text);
var entryMap = {};
state.entries.forEach(function (en) { entryMap[en.id] = en; });
(data.entries || []).forEach(function (en) { entryMap[en.id] = en; });
state.entries = Object.values(entryMap).sort(function (a, b) { return
(b.createdAt || 0) - (a.createdAt || 0); });
var mealMap = {};
state.meals.forEach(function (m) { mealMap[m.id] = m; });
(data.meals || []).forEach(function (m) { mealMap[m.id] = m; });
state.meals = Object.values(mealMap).sort(function (a, b) { return
(b.createdAt || 0) - (a.createdAt || 0); });
state.monthGoals = Object.assign({}, state.monthGoals, data.monthGoals ||
{});
render();
persistEntries();
persistMeals();
saveJSON("month-goals", state.monthGoals).then(function (res) {
if (!res.ok) showError(res.error);
});
flashSaved();
} catch (e) {
state.error = "読み込みに失敗しました。ファイルを確認してください。";
render();
setTimeout(function () { state.error = null; render(); }, 4000);
}
}
function groupedEntries() {
var byDate = {};
state.entries.forEach(function (en) {
if (!byDate[en.date]) byDate[en.date] = [];
byDate[en.date].push(en);
});
return Object.keys(byDate).sort().reverse().map(function (date) {
return [date, byDate[date]];
});
}
function workoutCountByDate() {
var map = {};
state.entries.forEach(function (en) {
if (en.name) map[en.date] = (map[en.date] || 0) + 1;
});
return map;
}
function weightByDate() {
var map = {};
state.entries.forEach(function (en) {
if (en.weight && !map[en.date]) map[en.date] = en.weight;
});
return map;
}
function computeStats() {
var weekAgo = new Date();
weekAgo.setDate(weekAgo.getDate() - 7);
var workouts = state.entries.filter(function (en) { return en.name; });
var thisWeek = workouts.filter(function (en) {
return new Date(en.date + "T00:00:00") >= weekAgo;
}).length;
return { total: workouts.length, thisWeek: thisWeek };
}
function monthGrid() {
var y = state.cursorMonth.y, m = state.cursorMonth.m;
var firstDay = new Date(y, m, 1);
var startWeekday = firstDay.getDay();
var daysInMonth = new Date(y, m + 1, 0).getDate();
var cells = [];
for (var i = 0; i < startWeekday; i++) cells.push(null);
for (var d = 1; d <= daysInMonth; d++) cells.push(d);
while (cells.length % 7 !== 0) cells.push(null);
return cells;
}
function changeMonth(delta) {
var m = state.cursorMonth.m + delta;
var y = state.cursorMonth.y;
if (m < 0) { m = 11; y -= 1; }
if (m > 11) { m = 0; y += 1; }
state.cursorMonth = { y: y, m: m };
render();
}
function handleGoalInput(monthKey, text) {
state.monthGoals[monthKey] = text;
if (goalSaveTimer) clearTimeout(goalSaveTimer);
goalSaveTimer = setTimeout(function () {
saveJSON("month-goals", state.monthGoals).then(function (res) {
if (!res.ok) showError(res.error);
});
}, 500);
}
// ---------- rendering ----------
function renderEntryCard(entry) {
var weightHtml = entry.weight
? '<div class="weight-pill">体重 ' + escapeHtml(entry.weight) + 'kg</div>'
: "";
var noteHtml = entry.note
? '<div class="note">' + escapeHtml(entry.note) + '</div>'
: "";
var nameHtml = entry.name
? escapeHtml(entry.name)
: '<span style="color:#C98AA8;">体重の記録</span>';
return (
'<div class="card" data-action="edit-workout" data-date="' + entry.date +
'">' +
'<div class="card-stripe"></div>' +
'<div class="card-body">' +
'<div class="card-top-row">' +
'<div class="ex-name">' + nameHtml + '</div>' +
'<button class="delete-btn" data-action="delete" data-id="' + entry.id
+ '" aria-label="削除">🗑</button>' +
'</div>' +
weightHtml +
noteHtml +
'</div>' +
'</div>'
);
}
function renderMealCard(meal) {
var fallbackIcon = meal.mealType === "アルコール" ? " " : " ";
var thumb = meal.photo
? '<img class="meal-thumb" src="' + meal.photo + '" alt="' +
escapeHtml(mealLabel(meal.mealType)) + '" />'
: '<div class="meal-thumb" style="display:flex;align-items:center;justify-content:center;font-size:22px;">' + fallbackIcon + '</div>';
var noteHtml = meal.note ? '<div class="note" style="margin-top:2px;">' +
escapeHtml(meal.note) + '</div>' : "";
return (
'<div class="card" data-action="edit-meal-entry" data-date="' + meal.date +
'" data-mealtype="' + escapeHtml(meal.mealType) + '">' +
'<div class="card-stripe" style="background:var(--pink-dark);"></div>' +
'<div class="meal-card-body">' +
thumb +
'<div style="flex:1;min-width:0;">' +
'<div class="meal-chip">' + escapeHtml(mealLabel(meal.mealType)) +
'</div>' +
noteHtml +
'</div>' +
'<button class="delete-btn" data-action="delete-meal" data-id="' +
meal.id + '" aria-label="削除">🗑</button>' +
'</div>' +
'</div>'
);
}
function renderHeader() {
var stats = computeStats();
return (
'<div class="header">' +

function allDatesWithContent() {
var set = {};
state.entries.forEach(function (en) { set[en.date] = true; });
state.meals.forEach(function (m) { set[m.date] = true; });
return Object.keys(set).sort().reverse();
}

function renderWeightChart() {
var points = state.entries
.filter(function (en) { return en.weight; })
.map(function (en) { return { date: en.date, weight: parseFloat(en.weight) };
})
.filter(function (p) { return !isNaN(p.weight); })
.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
var body = '<div class="list">';
if (points.length === 0) {
body += '<div class="chart-wrap"><div class="chart-empty">まだ体重の記録がありません<br>運動を記録する時に体重も入力すると、ここにグラフが表示されます</div></div>';
body += '</div>';
return body;
}
var W = 320, H = 180, padL = 34, padR = 12, padT = 16, padB = 24;
var weights = points.map(function (p) { return p.weight; });
var minW = Math.min.apply(null, weights);
var maxW = Math.max.apply(null, weights);
if (minW === maxW) { minW -= 1; maxW += 1; }
var rangePad = (maxW - minW) * 0.15 || 1;
minW -= rangePad; maxW += rangePad;
var n = points.length;
var xStep = n > 1 ? (W - padL - padR) / (n - 1) : 0;
function xAt(i) { return padL + xStep * i; }
function yAt(w) { return padT + (H - padT - padB) * (1 - (w - minW) / (maxW -
minW)); }
var pathD = points.map(function (p, i) {
return (i === 0 ? "M" : "L") + xAt(i).toFixed(1) + "," +
yAt(p.weight).toFixed(1);
}).join(" ");
var dots = points.map(function (p, i) {
var x = xAt(i), y = yAt(p.weight);
var showLabel = (i === 0 || i === n - 1 || i % Math.ceil(n / 6) === 0);
return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3" fill="#E8A93A" stroke="#fff" stroke-width="1.5" />' +
(showLabel ? '<text class="chart-value-label" x="' + x.toFixed(1) + '" y="'
+ (y - 8).toFixed(1) + '" text-anchor="middle">' + p.weight + '</text>' : '') +
(showLabel ? '<text class="chart-point-label" x="' + x.toFixed(1) + '" y="'
+ (H - 6) + '" text-anchor="middle">' + p.date.slice(5) + '</text>' : '');
}).join("");
var gridLines = "";
for (var i = 0; i <= 3; i++) {
var gy = padT + (H - padT - padB) * (i / 3);
var gw = maxW - (maxW - minW) * (i / 3);
gridLines += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W -
padR) + '" y2="' + gy.toFixed(1) + '" stroke="#F5E8C8" stroke-width="1" />' +
'<text class="chart-point-label" x="4" y="' + (gy + 3).toFixed(1) + '">' +
gw.toFixed(1) + '</text>';
}
var latest = points[points.length - 1].weight;
var first = points[0].weight;
var diff = (latest - first).toFixed(1);
var diffLabel = diff > 0 ? "+" + diff + "kg" : diff + "kg";
body += '<div class="chart-wrap">' +
'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">' +
'<div style="font-size:13px;color:#4A2C3A;font-weight:700;">体重の推移</div>'
+
'<div style="font-size:12px;color:#B0708C;">直近 <span style="color:#C9366F;font-weight:700;">' + latest + 'kg</span>（' + diffLabel +
'）</div>' +
'</div>' +
'<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;">' +
gridLines +
'<path d="' + pathD + '" fill="none" stroke="#E8A93A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />' +
dots +
'</svg>' +
'</div>';
body += '</div>';
return body;
}

});

var fab = app.querySelector('[data-action="open-form"]');

}
app.querySelectorAll('[data-action="close-modal"]').forEach(function (el) {

});
var modalInner = app.querySelector('[data-stop="1"]');

var form = document.getElementById("entry-form");

form.addEventListener("submit", function (e) {
e.preventDefault();
if (state.saving) return;
if (state.formTab === "workout") {

var date = document.getElementById("f-date").value || todayStr();
var weight = document.getElementById("f-weight").value;
var note = document.getElementById("f-note").value;

addEntry(name, date, weight, note);
} else {
var mDate = document.getElementById("m-date").value || todayStr();
var mNote = document.getElementById("m-note").value;
addMeal(mDate, state.formMealType, pendingPhotoDataUrl, mNote);
}
});
}
}
// ---------- keep modal visible above keyboard (iOS visualViewport fix) ----------
function syncModalToViewport() {
var overlay = document.querySelector(".modal-overlay");
if (!overlay || !window.visualViewport) return;
var vv = window.visualViewport;
overlay.style.position = "fixed";
overlay.style.left = "0px";
overlay.style.top = vv.offsetTop + "px";
overlay.style.width = vv.width + "px";
overlay.style.height = vv.height + "px";
var modal = overlay.querySelector(".modal");
if (modal) modal.style.maxHeight = Math.round(vv.height * 0.9) + "px";
}
if (window.visualViewport) {
window.visualViewport.addEventListener("resize", syncModalToViewport);
window.visualViewport.addEventListener("scroll", syncModalToViewport);
}
// 入力欄をタップしたら、キーボードが出た後にその欄が見える位置まで自動スクロール
document.addEventListener("focusin", function (e) {
var el = e.target;
if (!el.closest || !el.closest(".modal")) return;
if (el.tagName !== "INPUT" && el.tagName !== "TEXTAREA") return;
setTimeout(function () {
el.scrollIntoView({ block: "center", behavior: "smooth" });
}, 350);
});
// ---------- init ----------
render();
(async function init() {
try {
var results = await Promise.all([
loadJSON("workout-entries", []),
loadJSON("meal-entries", []),
loadJSON("motivation-entries", []),
loadJSON("month-goals", {})
]);
state.entries = results[0];
state.meals = results[1];
state.motivations = results[2];
state.monthGoals = results[3];
} catch (e) {
state.error = "データの読み込みに失敗しました。";
} finally {
state.loaded = true;
render();
}
})();
</script>
