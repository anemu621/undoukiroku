<title>ダイエット記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --pink:#E8578F; --pink-dark:#C9366F; --pink-light:#FDEEF4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
    background: var(--pink-light);
    color: #4A2C3A;
    font-family: 'Noto Sans JP', sans-serif;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; position: relative; }
  .header { padding: 22px 18px 0; background: #fff; border-bottom: 1px solid #F6D9E6; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 8px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--pink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
  .brand-text { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; color: var(--pink-dark); }
  .view-switch { display: flex; flex-wrap: wrap; background: var(--pink-light); border-radius: 20px; padding: 3px; gap: 2px; }
  .view-btn { display: flex; align-items: center; gap: 4px; border: none; background: transparent; color: #C98AA8; font-size: 11.5px; font-weight: 700; padding: 6px 10px; border-radius: 16px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .view-btn.active { background: var(--pink); color: #fff; }
  .stats-row { display: flex; padding-bottom: 16px; }
  .backup-row { display: flex; gap: 8px; padding: 0 18px 16px; }
  .backup-btn { flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px; border: 1px solid #F0C4D8; background: #FFF7FA; color: #C9366F; font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .stat-card { flex: 1; text-align: center; padding: 0 6px; }
  .stat-card + .stat-card { border-left: 1px solid #F6D9E6; }
  .stat-num { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; color: var(--pink); line-height: 1; }
  .stat-label { font-size: 11px; color: #B0708C; margin-top: 6px; }
  .error-banner { margin: 10px 18px 0; padding: 8px 12px; background: #FBE4EC; border: 1px solid #F0A8C4; color: #B0356A; font-size: 12px; border-radius: 8px; }
  .saved-banner { margin: 10px 18px 0; padding: 8px 12px; background: #E9F7EE; border: 1px solid #B6E3C5; color: #2E7D4F; font-size: 12px; border-radius: 8px; font-weight: 700; }
  .list { flex: 1; overflow-y: auto; padding: 18px 16px 100px; }
  .empty-state { text-align: center; color: #4A2C3A; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; }
  .loading-state { text-align: center; color: #B0708C; padding: 80px 20px; font-size: 13px; }
  .date-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .date-header-text { font-weight: 700; font-size: 14px; color: #4A2C3A; }
  .date-header-sub { font-size: 11px; color: #C98AA8; font-family: 'JetBrains Mono', monospace; }
  .card { display: flex; background: #fff; border: 1px solid #F6D9E6; border-radius: 12px; margin-bottom: 10px; overflow: hidden; animation: wl-in 0.2s ease; cursor: pointer; }
  @keyframes wl-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .card-stripe { width: 4px; background: var(--pink); }
  .card-body { flex: 1; padding: 12px 14px; }
  .card-top-row { display: flex; justify-content: space-between; align-items: center; }
  .delete-btn { background: none; border: none; padding: 4px; cursor: pointer; border-radius: 6px; line-height: 1; font-size: 14px; }
  .ex-name { font-size: 16px; font-weight: 700; color: #4A2C3A; }
  .note { margin-top: 8px; font-size: 12.5px; color: #B0708C; line-height: 1.5; white-space: pre-wrap; }
  .weight-pill { display: inline-block; margin-top: 8px; font-size: 11.5px; font-weight: 700; color: var(--pink-dark); background: var(--pink-light); border-radius: 20px; padding: 2px 10px; font-family: 'JetBrains Mono', monospace; }
  .fab { position: fixed; bottom: 24px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--pink); border: none; box-shadow: 0 6px 16px rgba(232,87,143,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 26px; font-weight: 700; z-index: 20; }
  .fab:disabled { opacity: 0.5; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-nav-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #F6D9E6; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--pink-dark); font-size: 18px; }
  .cal-month-label { font-size: 16px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: #4A2C3A; }
  .goal-input { width: 100%; background: #FFF7FA; border: 1px dashed #F0C4D8; border-radius: 10px; padding: 9px 12px; color: #4A2C3A; font-size: 13px; font-family: inherit; resize: none; min-height: 40px; margin-bottom: 16px; }
  .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .weekday-cell { text-align: center; font-size: 11px; color: #C98AA8; font-weight: 700; padding: 4px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell-empty { min-height: 46px; }
  .cal-cell { min-height: 46px; border: 1px solid #F6D9E6; background: #fff; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; color: #4A2C3A; font-family: inherit; padding: 4px 2px; }
  .cal-cell.today { border: 1px solid var(--pink); color: var(--pink-dark); }
  .cal-cell.has-entry { background: #FBDCEB; border-color: #F6C2DC; }
  .cal-cell.selected { background: var(--pink); border-color: var(--pink); color: #fff; }
  .cal-day-num { font-size: 13px; }
  .cal-day-num.today { font-weight: 800; }
  .cal-weight { font-size: 9.5px; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(74,44,58,0.4); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-top: 1px solid #F6D9E6; border-radius: 16px 16px 0 0; width: 100%; max-width: 480px; padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 4px; max-height: 88vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .modal-title { font-size: 17px; font-weight: 700; color: #4A2C3A; }
  .close-btn { background: none; border: none; cursor: pointer; padding: 4px; font-size: 14px; color: #C98AA8; }
  label.field-label { font-size: 11.5px; color: #B0708C; margin-top: 10px; margin-bottom: 5px; font-weight: 600; display: block; scroll-margin-top: 90px; }
  .field-input { width: 100%; background: #FFF7FA; border: 1.5px solid #E8A9C4; border-radius: 8px; padding: 10px 12px; color: #4A2C3A; font-size: 14px; font-family: inherit; scroll-margin-top: 90px; }
  .field-input:focus, .goal-input:focus { outline: none; border-color: var(--pink) !important; }
  textarea.field-input { resize: vertical; min-height: 56px; }
  .submit-btn { margin-top: 18px; background: var(--pink); color: #fff; border: none; border-radius: 10px; padding: 13px 0; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit; }
  .submit-btn:disabled { opacity: 0.6; }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: #f4c9dc; border-radius: 3px; }
  button:active { transform: scale(0.97); }
  .tab-switch { display: flex; background: var(--pink-light); border-radius: 20px; padding: 3px; gap: 2px; margin-bottom: 6px; }
  .tab-btn { flex: 1; border: none; background: transparent; color: #C98AA8; font-size: 13px; font-weight: 700; padding: 8px 0; border-radius: 16px; cursor: pointer; font-family: inherit; }
  .tab-btn.active { background: var(--pink); color: #fff; }
  .meal-type-row { display: flex; gap: 8px; margin-top: 4px; }
  .meal-type-btn { flex: 1; text-align: center; padding: 10px 2px; border-radius: 8px; border: 1px solid #F0C4D8; background: #FFF7FA; color: #4A2C3A; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .meal-type-btn.active { background: var(--pink); border-color: var(--pink); color: #fff; }
  .photo-input-btn { display: block; width: 100%; text-align: center; padding: 14px 0; border-radius: 8px; border: 1px dashed #F0C4D8; background: #FFF7FA; color: #C9366F; font-size: 13px; font-weight: 600; cursor: pointer; }
  .photo-preview { margin-top: 10px; }
  .photo-preview img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; display: block; }
  .meal-card-body { display: flex; gap: 10px; padding: 10px; align-items: center; }
  .meal-thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #FDEEF4; }
  .meal-chip { display: inline-block; font-size: 11px; font-weight: 700; color: var(--pink-dark); background: var(--pink-light); border-radius: 20px; padding: 2px 10px; margin-bottom: 4px; }
  .cal-meal { font-size: 9px; letter-spacing: 1px; color: var(--pink-dark); font-weight: 700; }
  .chart-wrap { background: #fff; border: 1px solid #F6D9E6; border-radius: 12px; padding: 16px 12px; margin-bottom: 16px; }
  .chart-empty { text-align: center; color: #B0708C; font-size: 13px; padding: 30px 10px; }
  .chart-point-label { font-size: 9px; fill: #C98AA8; }
  .chart-value-label { font-size: 10px; fill: #C9366F; font-weight: 700; }
  .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .gallery-item { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #FDEEF4; cursor: pointer; }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-viewer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 60; }
  .photo-viewer-overlay img { max-width: 92vw; max-height: 85vh; object-fit: contain; border-radius: 4px; }
  .photo-viewer-close { position: absolute; top: 18px; right: 18px; background: rgba(255,255,255,0.15); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .gallery-date { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(74,44,58,0.55); color: #fff; font-size: 9px; padding: 3px 5px; font-family: 'JetBrains Mono', monospace; }
  .gallery-meal-tag { position: absolute; top: 4px; left: 4px; background: rgba(232,87,143,0.85); color: #fff; font-size: 9px; padding: 1px 6px; border-radius: 10px; font-weight: 700; }
</style>
</head>

<div id="app"></div>

<script>
"use strict";

// ---------- storage helpers (persistent, per-user) ----------
async function loadJSON(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return { ok: true };
  } catch (e) {
    return { ok: false, error: (e && (e.message || e.toString())) || "unknown-error" };
  }
}

// ---------- date helpers ----------
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function todayStr() {
  var d = new Date();
  return ymd(d.getFullYear(), d.getMonth(), d.getDate());
}
function ymd(y, m, d) {
  return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}
function formatDateLabel(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  var todayS = todayStr();
  var yest = new Date();
  yest.setDate(yest.getDate() - 1);
  var yestS = yest.toISOString().slice(0, 10);
  if (dateStr === todayS) return "今日";
  if (dateStr === yestS) return "昨日";
  return d.toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "short" });
}
function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

var MEAL_BTN_LABEL = { "朝": "朝", "昼": "昼", "夜": "夜", "アルコール": "🍺" };

var goalSaveTimer = null;

function persistEntries() {
  return saveJSON("workout-entries", state.entries).then(function (res) {
    if (!res.ok) showError(res.error);
    return res.ok;
  });
}
function showError(detail) {
  state.error = "保存に失敗しました" + (detail ? "（" + detail + "）" : "") + "。もう一度お試しください。";
  render();
  setTimeout(function () {
    state.error = null;
    render();
  }, 6000);
}
function flashSaved() {
  state.savedFlash = true;
  render();
  setTimeout(function () {
    state.savedFlash = false;
    render();
  }, 1400);
}

async function addEntry(name, date, weight, note) {
  var existing = state.entries.find(function (en) { return en.date === date; });
  if (existing) {
    existing.name = name;
    existing.weight = weight;
    existing.note = note;
    existing.createdAt = Date.now();
  } else {
    state.entries.unshift({ id: uid(), createdAt: Date.now(), name: name, date: date, weight: weight, note: note });
  }
  state.saving = true;
  render();
  var ok = await persistEntries();
  state.saving = false;
  state.showForm = false;
  render();
  if (ok) flashSaved();
}
async function deleteEntry(id) {
  state.entries = state.entries.filter(function (en) { return en.id !== id; });
  render();
  await persistEntries();
}

function persistMeals() {
  return saveJSON("meal-entries", state.meals).then(function (res) {
    if (!res.ok) showError(res.error);
    return res.ok;
  });
}
async function addMeal(date, mealType, photo, note) {
  var existing = state.meals.find(function (m) { return m.date === date && m.mealType === mealType; });
  if (existing) {
    existing.photo = photo || null;
    existing.note = note || "";
    existing.createdAt = Date.now();
  } else {
    state.meals.unshift({ id: uid(), createdAt: Date.now(), date: date, mealType: mealType, photo: photo || null, note: note || "" });
  }
  state.saving = true;
  render();
  var ok = await persistMeals();
  pendingPhotoDataUrl = null;
  state.saving = false;
  state.showForm = false;
  render();
  if (ok) flashSaved();
}
async function deleteMeal(id) {
  state.meals = state.meals.filter(function (m) { return m.id !== id; });
  render();
  await persistMeals();
}
function mealsByDate(dateStr) {
  return state.meals.filter(function (m) { return m.date === dateStr; })
    .sort(function (a, b) { return MEAL_TYPES.indexOf(a.mealType) - MEAL_TYPES.indexOf(b.mealType); });
}
function mealTypesByDate() {
  var map = {};
  state.meals.forEach(function (m) {
    if (!map[m.date]) map[m.date] = [];
    if (map[m.date].indexOf(m.mealType) === -1) map[m.date].push(m.mealType);
  });
  Object.keys(map).forEach(function (date) {
    map[date].sort(function (a, b) { return MEAL_TYPES.indexOf(a) - MEAL_TYPES.indexOf(b); });
  });
  return map;
}
function resizeImageFile(file, callback) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var img = new Image();
    img.onload = function () {
      var maxW = 480;
      var scale = Math.min(1, maxW / img.width);
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL("image/jpeg", 0.6));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function exportData() {
  var payload = {
    exportedAt: new Date().toISOString(),
    entries: state.entries,
    meals: state.meals,
    monthGoals: state.monthGoals
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var stamp = todayStr();
  a.href = url;
  a.download = "training-log-backup-" + stamp + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

async function importDataFromFile(file) {
  try {
    var text = await file.text();
    var data = JSON.parse(text);
    var entryMap = {};
    state.entries.forEach(function (en) { entryMap[en.id] = en; });
    (data.entries || []).forEach(function (en) { entryMap[en.id] = en; });
    state.entries = Object.values(entryMap).sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

    var mealMap = {};
    state.meals.forEach(function (m) { mealMap[m.id] = m; });
    (data.meals || []).forEach(function (m) { mealMap[m.id] = m; });
    state.meals = Object.values(mealMap).sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

    state.monthGoals = Object.assign({}, state.monthGoals, data.monthGoals || {});

    render();
    persistEntries();
    persistMeals();
    saveJSON("month-goals", state.monthGoals).then(function (res) {
      if (!res.ok) showError(res.error);
    });
    flashSaved();
  } catch (e) {
    state.error = "読み込みに失敗しました。ファイルを確認してください。";
    render();
    setTimeout(function () { state.error = null; render(); }, 4000);
  }
}

function groupedEntries() {
  var byDate = {};
  state.entries.forEach(function (en) {
    if (!byDate[en.date]) byDate[en.date] = [];
    byDate[en.date].push(en);
  });
  return Object.keys(byDate).sort().reverse().map(function (date) {
    return [date, byDate[date]];
  });
}
function workoutCountByDate() {
  var map = {};
  state.entries.forEach(function (en) {
    if (en.name) map[en.date] = (map[en.date] || 0) + 1;
  });
  return map;
}
function weightByDate() {
  var map = {};
  state.entries.forEach(function (en) {
    if (en.weight && !map[en.date]) map[en.date] = en.weight;
  });
  return map;
}
function computeStats() {
  var weekAgo = new Date();
  weekAgo.setDate(weekAgo.getDate() - 7);
  var workouts = state.entries.filter(function (en) { return en.name; });
  var thisWeek = workouts.filter(function (en) {
    return new Date(en.date + "T00:00:00") >= weekAgo;
  }).length;
  return { total: workouts.length, thisWeek: thisWeek };
}
function monthGrid() {
  var y = state.cursorMonth.y, m = state.cursorMonth.m;
  var firstDay = new Date(y, m, 1);
  var startWeekday = firstDay.getDay();
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var cells = [];
  for (var i = 0; i < startWeekday; i++) cells.push(null);
  for (var d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  return cells;
}

function changeMonth(delta) {
  var m = state.cursorMonth.m + delta;
  var y = state.cursorMonth.y;
  if (m < 0) { m = 11; y -= 1; }
  if (m > 11) { m = 0; y += 1; }
  state.cursorMonth = { y: y, m: m };
  render();
}

function handleGoalInput(monthKey, text) {
  state.monthGoals[monthKey] = text;
  if (goalSaveTimer) clearTimeout(goalSaveTimer);
  goalSaveTimer = setTimeout(function () {
    saveJSON("month-goals", state.monthGoals).then(function (res) {
      if (!res.ok) showError(res.error);
    });
  }, 500);
}

function allDatesWithContent() {
  var set = {};
  state.entries.forEach(function (en) { set[en.date] = true; });
  state.meals.forEach(function (m) { set[m.date] = true; });
  return Object.keys(set).sort().reverse();
}

function renderList() {
  var dates = allDatesWithContent();
  if (dates.length === 0) {
    return (
      '<div class="list">' +
        '<div class="empty-state">' +
          '<div style="font-size:28px;">🔥</div>' +
          '<div style="margin-top:10px;font-weight:700;">まだ記録がありません</div>' +
          '<div style="margin-top:4px;color:#B0708C;font-size:13px;">下の「+」ボタンから最初の運動や食事を記録しましょう</div>' +
        '</div>' +
      '</div>'
    );
  }
  var html = '<div class="list">';
  dates.forEach(function (date) {
    var workouts = state.entries.filter(function (en) { return en.date === date; });
    var meals = mealsByDate(date);
    html += '<div style="margin-bottom:22px;">';
    html += '<div class="date-header"><span class="date-header-text">' + formatDateLabel(date) + '</span><span class="date-header-sub">' + date + '</span></div>';
    workouts.forEach(function (en) { html += renderEntryCard(en); });
    meals.forEach(function (m) { html += renderMealCard(m); });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderCalendar() {
  var counts = workoutCountByDate();
  var weights = weightByDate();
  var mealMarks = mealTypesByDate();
  var monthKey = state.cursorMonth.y + "-" + state.cursorMonth.m;
  var goalText = state.monthGoals[monthKey] || "";
  var cells = monthGrid();
  var today = todayStr();

  var html = '<div class="list">';
  html += '<div class="cal-header">' +
    '<button class="cal-nav-btn" data-action="prev-month">‹</button>' +
    '<div class="cal-month-label">' + state.cursorMonth.y + '年' + (state.cursorMonth.m + 1) + '月</div>' +
    '<button class="cal-nav-btn" data-action="next-month">›</button>' +
  '</div>';

  html += '<textarea class="goal-input" data-action="goal-input" data-month-key="' + monthKey + '" placeholder="今月の目標を書く">' + escapeHtml(goalText) + '</textarea>';

  html += '<div class="weekday-row">';
  WEEKDAYS.forEach(function (w) { html += '<div class="weekday-cell">' + w + '</div>'; });
  html += '</div>';

  html += '<div class="cal-grid">';
  cells.forEach(function (d) {
    if (d === null) { html += '<div class="cal-cell-empty"></div>'; return; }
    var dateStr = ymd(state.cursorMonth.y, state.cursorMonth.m, d);
    var count = counts[dateStr] || 0;
    var weight = weights[dateStr];
    var meals = mealMarks[dateStr];
    var isSelected = dateStr === state.selectedDate;
    var isToday = dateStr === today;
    var cls = "cal-cell";
    if (count > 0) cls += " has-entry";
    if (isToday && !isSelected) cls += " today";
    if (isSelected) cls += " selected";
    html += '<button class="' + cls + '" data-action="select-date" data-date="' + dateStr + '">' +
      '<span class="cal-day-num' + (isToday ? " today" : "") + '">' + d + '</span>' +
      (weight ? '<span class="cal-weight">' + escapeHtml(weight) + '</span>' : '') +
      (meals && meals.length ? '<span class="cal-meal">' + meals.map(function (t) { return MEAL_MARK[t] || t; }).join("") + '</span>' : '') +
    '</button>';
  });
  html += '</div>';

  html += '<div style="margin-top:20px;">';
  html += '<div class="date-header"><span class="date-header-text">' + formatDateLabel(state.selectedDate) + 'の記録</span><span class="date-header-sub">' + state.selectedDate + '</span></div>';
  var dayEntries = state.entries.filter(function (en) { return en.date === state.selectedDate; });
  var dayMeals = mealsByDate(state.selectedDate);
  if (dayEntries.length === 0 && dayMeals.length === 0) {
    html += '<div class="empty-state" style="padding:30px 20px;"><div style="color:#B0708C;font-size:13px;">この日はまだ記録がありません</div></div>';
  } else {
    dayEntries.forEach(function (en) { html += renderEntryCard(en); });
    dayMeals.forEach(function (m) { html += renderMealCard(m); });
  }
  html += '</div>';

  html += '</div>';
  return html;
}

function renderModal() {
  if (!state.showForm) return "";
  var existingEntry = state.entries.find(function (en) { return en.date === state.formDate; }) || { name: "", weight: "", note: "" };
  var isWorkout = state.formTab === "workout";

  var tabsHtml =
    '<div class="tab-switch">' +
      '<button type="button" class="tab-btn' + (isWorkout ? " active" : "") + '" data-action="form-tab" data-tab="workout">🏋️ 運動</button>' +
      '<button type="button" class="tab-btn' + (!isWorkout ? " active" : "") + '" data-action="form-tab" data-tab="meal">🍚 食事</button>' +
    '</div>';

  var workoutFieldsHtml =
    '<label class="field-label">今日やったこと</label>' +
    '<input class="field-input" id="f-name" placeholder="例：ベンチプレス、ランニング（体重だけでもOK）" value="' + escapeHtml(existingEntry.name) + '" />' +
    '<label class="field-label">日付</label>' +
    '<input class="field-input" style="width:160px;" type="date" id="f-date" value="' + state.formDate + '" />' +
    '<label class="field-label">体重(kg)</label>' +
    '<input class="field-input" style="width:110px;" type="number" inputmode="decimal" step="0.1" id="f-weight" placeholder="60.0" value="' + escapeHtml(existingEntry.weight) + '" />' +
    '<label class="field-label">メモ</label>' +
    '<textarea class="field-input" id="f-note" placeholder="調子や気づいたことを記録">' + escapeHtml(existingEntry.note) + '</textarea>' +
    '<button type="submit" class="submit-btn"' + (state.saving ? ' disabled' : '') + '>' + (state.saving ? '保存中…' : '記録する') + '</button>';

  var mealTypeButtons = MEAL_TYPES.map(function (t) {
    return '<button type="button" class="meal-type-btn' + (state.formMealType === t ? " active" : "") + '" data-action="meal-type" data-type="' + t + '">' + (MEAL_BTN_LABEL[t] || t) + '</button>';
  }).join("");

  var isAlcohol = state.formMealType === "アルコール";

  var previewHtml = pendingPhotoDataUrl
    ? '<div class="photo-preview" id="photo-preview"><img src="' + pendingPhotoDataUrl + '" /></div>'
    : '<div class="photo-preview" id="photo-preview"></div>';

  var photoSectionHtml = isAlcohol ? "" :
    '<label class="field-label">写真</label>' +
    '<label class="photo-input-btn">📷 写真を選ぶ・撮る' +
      '<input type="file" accept="image/*" id="m-photo" style="display:none;" />' +
    '</label>' +
    previewHtml;

  var existingMeal = state.meals.find(function (m) { return m.date === state.formDate && m.mealType === state.formMealType; }) || { note: "" };
  var mealFieldsHtml =
    '<label class="field-label">日付</label>' +
    '<input class="field-input" style="width:160px;" type="date" id="m-date" value="' + state.formDate + '" />' +
    '<label class="field-label">いつのごはん？</label>' +
    '<div class="meal-type-row">' + mealTypeButtons + '</div>' +
    photoSectionHtml +
    '<label class="field-label">メモ</label>' +
    '<textarea class="field-input" id="m-note" placeholder="食べたものや感想を記録">' + escapeHtml(existingMeal.note) + '</textarea>' +
    '<button type="submit" class="submit-btn"' + (state.saving ? ' disabled' : '') + '>' + (state.saving ? '保存中…' : '記録する') + '</button>';

  return (
    '<div class="modal-overlay" data-action="close-modal">' +
      '<form class="modal" id="entry-form" data-stop="1">' +
        '<div class="modal-header">' +
          '<div class="modal-title">記録する</div>' +
          '<button type="button" class="close-btn" data-action="close-modal">✕</button>' +
        '</div>' +
        tabsHtml +
        (isWorkout ? workoutFieldsHtml : mealFieldsHtml) +
      '</form>' +
    '</div>'
  );
}

function renderWeightChart() {
  var points = state.entries
    .filter(function (en) { return en.weight; })
    .map(function (en) { return { date: en.date, weight: parseFloat(en.weight) }; })
    .filter(function (p) { return !isNaN(p.weight); })
    .sort(function (a, b) { return a.date < b.date ? -1 : 1; });

  var body = '<div class="list">';
  if (points.length === 0) {
    body += '<div class="chart-wrap"><div class="chart-empty">まだ体重の記録がありません<br>運動を記録する時に体重も入力すると、ここにグラフが表示されます</div></div>';
    body += '</div>';
    return body;
  }

  var W = 320, H = 180, padL = 34, padR = 12, padT = 16, padB = 24;
  var weights = points.map(function (p) { return p.weight; });
  var minW = Math.min.apply(null, weights);
  var maxW = Math.max.apply(null, weights);
  if (minW === maxW) { minW -= 1; maxW += 1; }
  var rangePad = (maxW - minW) * 0.15 || 1;
  minW -= rangePad; maxW += rangePad;

  var n = points.length;
  var xStep = n > 1 ? (W - padL - padR) / (n - 1) : 0;
  function xAt(i) { return padL + xStep * i; }
  function yAt(w) { return padT + (H - padT - padB) * (1 - (w - minW) / (maxW - minW)); }

  var pathD = points.map(function (p, i) {
    return (i === 0 ? "M" : "L") + xAt(i).toFixed(1) + "," + yAt(p.weight).toFixed(1);
  }).join(" ");

  var dots = points.map(function (p, i) {
    var x = xAt(i), y = yAt(p.weight);
    var showLabel = (i === 0 || i === n - 1 || i % Math.ceil(n / 6) === 0);
    return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3" fill="#E8A93A" stroke="#fff" stroke-width="1.5" />' +
      (showLabel ? '<text class="chart-value-label" x="' + x.toFixed(1) + '" y="' + (y - 8).toFixed(1) + '" text-anchor="middle">' + p.weight + '</text>' : '') +
      '<text class="chart-point-label" x="' + x.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + p.date.slice(5) + '</text>';
  }).join("");

  var gridLines = "";
  for (var i = 0; i <= 3; i++) {
    var gy = padT + (H - padT - padB) * (i / 3);
    var gw = maxW - (maxW - minW) * (i / 3);
    gridLines += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '" stroke="#F5E8C8" stroke-width="1" />' +
      '<text class="chart-point-label" x="4" y="' + (gy + 3).toFixed(1) + '">' + gw.toFixed(1) + '</text>';
  }

  var latest = points[points.length - 1].weight;
  var first = points[0].weight;
  var diff = (latest - first).toFixed(1);
  var diffLabel = diff > 0 ? "+" + diff + "kg" : diff + "kg";

  body += '<div class="chart-wrap">' +
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">' +
      '<div style="font-size:13px;color:#4A2C3A;font-weight:700;">体重の推移</div>' +
      '<div style="font-size:12px;color:#B0708C;">直近 <span style="color:#C9366F;font-weight:700;">' + latest + 'kg</span>（' + diffLabel + '）</div>' +
    '</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;">' +
      gridLines +
      '<path d="' + pathD + '" fill="none" stroke="#E8A93A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />' +
      dots +
    '</svg>' +
  '</div>';
  body += '</div>';
  return body;
}

function renderGallery() {
  var withPhotos = state.meals.filter(function (m) { return m.photo; })
    .sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  if (withPhotos.length === 0) {
    return (
      '<div class="list">' +
        '<div class="empty-state">' +
          '<div style="font-size:28px;">🖼️</div>' +
          '<div style="margin-top:10px;font-weight:700;">まだ写真がありません</div>' +
          '<div style="margin-top:4px;color:#B0708C;font-size:13px;">食事を記録する時に写真を添えると、ここに並びます</div>' +
        '</div>' +
      '</div>'
    );
  }
  var html = '<div class="list"><div class="gallery-grid">';
  withPhotos.forEach(function (m) {
    html += '<div class="gallery-item" data-action="view-photo" data-id="' + m.id + '">' +
      '<img src="' + m.photo + '" alt="" />' +
      '<div class="gallery-meal-tag">' + escapeHtml(m.mealType) + '</div>' +
      '<div class="gallery-date">' + m.date.slice(5) + '</div>' +
    '</div>';
  });
  html += '</div></div>';
  return html;
}

function renderPhotoViewer() {
  if (!state.viewingPhoto) return "";
  return (
    '<div class="photo-viewer-overlay" data-action="close-viewer">' +
      '<button class="photo-viewer-close" data-action="close-viewer">✕</button>' +
      '<img src="' + state.viewingPhoto + '" alt="" />' +
    '</div>'
  );
}

function renderApp() {
  if (!state.loaded) {
    return '<div class="header"><div class="header-top"><div class="brand"><div class="brand-mark">💪</div><div class="brand-text">ダイエット記録</div></div></div></div>' +
      '<div class="loading-state">読み込み中...</div>';
  }
  var errorHtml = state.error ? '<div class="error-banner">' + escapeHtml(state.error) + '</div>' : "";
  var savedHtml = state.savedFlash ? '<div class="saved-banner">✓ 保存しました</div>' : "";
  var body = state.view === "list" ? renderList()
    : state.view === "calendar" ? renderCalendar()
    : state.view === "weight" ? renderWeightChart()
    : renderGallery();
  return (
    renderHeader() +
    errorHtml +
    savedHtml +
    body +
    '<button class="fab" data-action="open-form" aria-label="運動を記録">+</button>' +
    renderModal() +
    renderPhotoViewer()
  );
}

function render() {
  document.getElementById("app").innerHTML = renderApp();
  attachEvents();
}

function attachEvents() {
  var app = document.getElementById("app");

  var exportBtn = app.querySelector('[data-action="export"]');
  if (exportBtn) exportBtn.addEventListener("click", exportData);

  var importInput = app.querySelector("#import-input");
  if (importInput) {
    importInput.addEventListener("change", function () {
      var file = importInput.files && importInput.files[0];
      if (file) importDataFromFile(file);
      importInput.value = "";
    });
  }

  app.querySelectorAll('[data-action="view"]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.view = btn.getAttribute("data-view");
      render();
    });
  });

  app.querySelectorAll('[data-action="delete"]').forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      deleteEntry(btn.getAttribute("data-id"));
    });
  });

  app.querySelectorAll('[data-action="delete-meal"]').forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      deleteMeal(btn.getAttribute("data-id"));
    });
  });

  app.querySelectorAll('[data-action="edit-workout"]').forEach(function (card) {
    card.addEventListener("click", function () {
      state.formDate = card.getAttribute("data-date");
      state.formTab = "workout";
      state.showForm = true;
      render();
      syncModalToViewport();
    });
  });

  app.querySelectorAll('[data-action="edit-meal-entry"]').forEach(function (card) {
    card.addEventListener("click", function () {
      state.formDate = card.getAttribute("data-date");
      state.formTab = "meal";
      state.formMealType = card.getAttribute("data-mealtype");
      var existingMeal = state.meals.find(function (m) { return m.date === state.formDate && m.mealType === state.formMealType; });
      pendingPhotoDataUrl = existingMeal ? existingMeal.photo : null;
      state.showForm = true;
      render();
      syncModalToViewport();
    });
  });

  app.querySelectorAll('[data-action="view-photo"]').forEach(function (item) {
    item.addEventListener("click", function () {
      var meal = state.meals.find(function (m) { return m.id === item.getAttribute("data-id"); });
      if (meal && meal.photo) {
        state.viewingPhoto = meal.photo;
        render();
      }
    });
  });

  app.querySelectorAll('[data-action="close-viewer"]').forEach(function (el) {
    el.addEventListener("click", function () {
      state.viewingPhoto = null;
      render();
    });
  });

  var prevBtn = app.querySelector('[data-action="prev-month"]');
  if (prevBtn) prevBtn.addEventListener("click", function () { changeMonth(-1); });
  var nextBtn = app.querySelector('[data-action="next-month"]');
  if (nextBtn) nextBtn.addEventListener("click", function () { changeMonth(1); });

  app.querySelectorAll('[data-action="select-date"]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.selectedDate = btn.getAttribute("data-date");
      render();
    });
  });

  function syncPendingPhoto() {
    var existingMeal = state.meals.find(function (m) { return m.date === state.formDate && m.mealType === state.formMealType; });
    pendingPhotoDataUrl = existingMeal ? existingMeal.photo : null;
  }

  app.querySelectorAll('[data-action="form-tab"]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      var dateEl = document.getElementById("f-date") || document.getElementById("m-date");
      if (dateEl && dateEl.value) state.formDate = dateEl.value;
      state.formTab = btn.getAttribute("data-tab");
      if (state.formTab === "meal") syncPendingPhoto();
      render();
    });
  });

  app.querySelectorAll('[data-action="meal-type"]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.formMealType = btn.getAttribute("data-type");
      if (state.formMealType === "アルコール") {
        pendingPhotoDataUrl = null;
      } else {
        syncPendingPhoto();
      }
      render();
    });
  });

  var photoInput = app.querySelector("#m-photo");
  if (photoInput) {
    photoInput.addEventListener("change", function () {
      var file = photoInput.files && photoInput.files[0];
      if (!file) return;
      resizeImageFile(file, function (dataUrl) {
        pendingPhotoDataUrl = dataUrl;
        var preview = document.getElementById("photo-preview");
        if (preview) preview.innerHTML = '<img src="' + dataUrl + '" />';
      });
    });
  }

  var goalInput = app.querySelector('[data-action="goal-input"]');
  if (goalInput) {
    goalInput.addEventListener("input", function () {
      handleGoalInput(goalInput.getAttribute("data-month-key"), goalInput.value);
    });
  }

  var fab = app.querySelector('[data-action="open-form"]');
  if (fab) {
    fab.addEventListener("click", function () {
      state.formDate = state.view === "calendar" ? state.selectedDate : todayStr();
      state.formTab = "workout";
      state.formMealType = "朝";
      syncPendingPhoto();
      state.showForm = true;
      render();
      syncModalToViewport();
    });
  }

  app.querySelectorAll('[data-action="close-modal"]').forEach(function (el) {
    el.addEventListener("click", function (e) {
      if (e.target.getAttribute("data-action") === "close-modal") {
        state.showForm = false;
        render();
      }
    });
  });

  var modalInner = app.querySelector('[data-stop="1"]');
  if (modalInner) {
    modalInner.addEventListener("click", function (e) { e.stopPropagation(); });
  }

  var form = document.getElementById("entry-form");
  if (form) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (state.saving) return;
      if (state.formTab === "workout") {
        var name = document.getElementById("f-name").value.trim();
        var date = document.getElementById("f-date").value || todayStr();
        var weight = document.getElementById("f-weight").value;
        var note = document.getElementById("f-note").value;
        if (!name && !weight) return;
        addEntry(name, date, weight, note);
      } else {
        var mDate = document.getElementById("m-date").value || todayStr();
        var mNote = document.getElementById("m-note").value;
        addMeal(mDate, state.formMealType, pendingPhotoDataUrl, mNote);
      }
    });
  }
}

// ---------- keep modal visible above keyboard (iOS visualViewport fix) ----------
function syncModalToViewport() {
  var overlay = document.querySelector(".modal-overlay");
  if (!overlay || !window.visualViewport) return;
  var vv = window.visualViewport;
  overlay.style.position = "fixed";
  overlay.style.left = "0px";
  overlay.style.top = vv.offsetTop + "px";
  overlay.style.width = vv.width + "px";
  overlay.style.height = vv.height + "px";
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", syncModalToViewport);
  window.visualViewport.addEventListener("scroll", syncModalToViewport);
}

// 入力欄をタップしたら、キーボードが出た後にその欄が見える位置まで自動スクロール
document.addEventListener("focusin", function (e) {
  var el = e.target;
  if (!el.closest || !el.closest(".modal")) return;
  if (el.tagName !== "INPUT" && el.tagName !== "TEXTAREA") return;
  setTimeout(function () {
    el.scrollIntoView({ block: "center", behavior: "smooth" });
  }, 350);
});

// ---------- init ----------
render();
(async function init() {
  try {
    var results = await Promise.all([
      loadJSON("workout-entries", []),
      loadJSON("meal-entries", []),
      loadJSON("month-goals", {})
    ]);
    state.entries = results[0];
    state.meals = results[1];
    state.monthGoals = results[2];
  } catch (e) {
    state.error = "データの読み込みに失敗しました。";
  } finally {
    state.loaded = true;
    render();
  }
})();
</script>
</body>
</html>
